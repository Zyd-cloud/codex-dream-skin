<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 梦境皮肤</title>
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="bar">
  <div>
    <h1>Codex 梦境皮肤</h1>
    <p class="sub" id="subtitle">正在读取状态…</p>
  </div>
  <div class="actions">
    <button type="button" id="btn-apply">应用皮肤</button>
    <button type="button" id="btn-original">恢复官方外观</button>
  </div>
</header>

<section class="status" id="status" hidden>
  <span class="chip" id="chip-skin"></span>
  <span class="chip" id="chip-codex"></span>
  <span class="chip" id="chip-injector"></span>
  <span class="chip" id="chip-active"></span>
</section>

<section>
  <div class="section-head">
    <h2>本地主题</h2>
    <button type="button" class="link" id="btn-refresh">刷新</button>
  </div>
  <div class="grid" id="themes"></div>
  <p class="empty" id="themes-empty" hidden>还没有任何主题。</p>
</section>

<section>
  <div class="section-head">
    <h2>主题市场</h2>
    <button type="button" class="link" id="btn-market">加载市场</button>
  </div>
  <p class="hint" id="market-hint">来自 dreamskin.cc 的社区主题（800+），点击安装即下载并应用。</p>
  <div class="market-tools" id="market-tools" hidden>
    <input type="search" id="market-search" placeholder="按名称或作者筛选…" autocomplete="off">
  </div>
  <div class="grid" id="market"></div>
  <div class="more" id="market-more" hidden>
    <button type="button" class="link" id="btn-more">显示更多</button>
  </div>
</section>

<p class="toast" id="toast" hidden></p>

<dialog id="edit-dialog" class="sheet">
  <form method="dialog" id="edit-form">
    <h2>编辑主题</h2>
    <p class="hint" id="edit-id"></p>
    <label class="field">
      <span>名称</span>
      <input type="text" id="edit-name" maxlength="60" autocomplete="off" required>
    </label>
    <label class="field">
      <span>外观</span>
      <select id="edit-appearance">
        <option value="auto">跟随系统</option>
        <option value="dark">深色</option>
        <option value="light">浅色</option>
      </select>
    </label>
    <label class="field">
      <span>任务模式</span>
      <select id="edit-taskmode">
        <option value="ambient">环境（背景弱化）</option>
        <option value="full">完整壁纸</option>
        <option value="off">关闭背景</option>
      </select>
    </label>
    <label class="field">
      <span>安全区</span>
      <select id="edit-safearea">
        <option value="none">无（图铺满）</option>
        <option value="left">文字在左</option>
        <option value="right">文字在右</option>
      </select>
    </label>
    <label class="field">
      <span>取景横轴 <output id="edit-focusx-out"></output></span>
      <input type="range" id="edit-focusx" min="0" max="1" step="0.01">
    </label>
    <label class="field">
      <span>取景纵轴 <output id="edit-focusy-out"></output></span>
      <input type="range" id="edit-focusy" min="0" max="1" step="0.01">
    </label>
    <menu>
      <button type="button" class="link" id="edit-cancel">取消</button>
      <button type="button" class="primary" id="edit-save">保存</button>
    </menu>
  </form>
</dialog>

<dialog id="confirm-dialog" class="sheet">
  <h2>删除主题</h2>
  <p class="hint" id="confirm-text"></p>
  <menu>
    <button type="button" class="link" id="confirm-cancel">取消</button>
    <button type="button" class="danger" id="confirm-ok">删除</button>
  </menu>
</dialog>
</body>
</html>
